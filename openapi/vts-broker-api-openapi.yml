      summary: Fetches Broker Activities
      tags:
      - Broker
      security:
      - basic_auth: []
      responses:
        '200':
          description: Returns list of Broker Activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: broker_activities
                      attributes:
                        type: object
                        properties:
                          total_active_deals:
                            type: object
