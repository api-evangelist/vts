                                  description: Broker Email Address
                                  nullable: true
                              deprecated: true
                            building_class:
                              type: string
                              example: A
                              enum:
                              - A
                              - B
                              - C
                              description: 'The Building Class for this Asset. Possible values: A, B, C.'
                            has_office_space:
                              type: boolean
                              description: Whether this Asset has office space
                            has_retail_space:
                              type: boolean
                              description: Whether this Asset has retail space
                            has_industrial_space:
                              type: boolean
                              description: Whether this Asset has industrial space
                            number_of_floors:
                              type: number
                              description: The number of floors this Asset has
                              nullable: true
                            rentable_building_area:
                              $ref: '#/components/schemas/measure_size'
                            size:
                              $ref: '#/components/schemas/measure_size'
                            submarket:
                              type: string
                              nullable: true
                              description: The submarket in which this Asset is located
                            market:
                              type: string
                              nullable: true
                              description: The market in which this Asset is located
                            floors:
                              type: array
                              items:
                                type: object
                                properties:
                                  position:
                                    type: number
                                    description: The floor position
                                  name:
                                    type: string
                                    description: The name or label for this floor
                            building_contacts:
                              type: array
                              items:
