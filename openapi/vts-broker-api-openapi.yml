                              idle:
                                type: number
                                example: 1
                                description: Number of deals with deal stage `idle`
                              dead_deal:
                                type: number
                                example: 1
                                description: Number of deals with deal stage `dead_deal`
                              lease_executed:
                                type: number
                                example: 1
                                description: Number of deals with deal stage `lease_executed`
        '403':
          description: API not authorized for use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
      operationId: get_api-v1-broker-activities
  /api/v1/broker/agents:
    get:
      summary: Fetches broker agent users
      tags:
      - Broker
      security:
      - basic_auth: []
      parameters:
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
      - name: page[before]
        in: query
        required: false
        schema:
          type: string
      - name: page[after]
        in: query
        required: false
        schema:
          type: string
      - name: filter[updated_since]
        in: query
        schema:
          type: string
          format: date-time
        required: false
        description: Only display records that have been modified after the given date/timestamp. Should be in `YYYY-MM-DD HH:MM:SS` (ISO8601) format. (Hours, minutes, and seconds are optional.)
        example: '2021-03-15'
      responses:
        '200':
          description: Returns a list of broker agent users associated with the current account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1'
                        type:
                          type: string
                          example: broker_agents
                        attributes:
                          type: object
                          properties:
                            first_name:
                              type: string
                              example: John
                            last_name:
                              type: string
                              example: Doe
                            email:
                              type: string
                              example: johndoe@example.com
                            created_at:
                              type: string
                              format: date-time
                              description: The created at date-time the current broker user
                            current_sign_in_at:
                              type: string
                              nullable: true
                              format: date-time
                            is_account_user:
                              type: boolean
                            is_company_admin:
                              type: boolean
                            phone:
                              type: string
                              example: '1234567890'
                            phone_extension:
                              type: string
                              example: '1234'
                            days_signed_in_for_last_30_days:
                              type: number
                              minimum: 0
                              maximum: 30
                              example: 14
                              description: Within the last 30 days, the number of days where the User had at least 1 login
                            days_with_activity_for_last_30_days:
                              type: number
                              minimum: 0
                              maximum: 30
                              example: 10
                              description: Within the last 30 days, the number of days where the User performed at least 1 creation, update, or deletion within VTS Lease
                            email_engagement_for_last_30_days:
                              type: object
                              description: VTS email activity for this User
                              properties:
                                emails_delivered:
                                  type: number
                                  minimum: 0
                                  maximum: 30
                                  example: 4
                                  description: Within the last 30 days, the number of emails delivered to this User
                                emails_opened:
                                  type: number
                                  minimum: 0
                                  maximum: 30
                                  example: 3
                                  description: Within the last 30 days, number of emails opened by this User
                            assets:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                    example: asset
                                  name:
                                    type: string
                                    example: A property name
                                    nullable: true
                                  owner_name:
                                    type: string
                                    example: VTS Investments
                                  address:
                                    type: string
                                    example: 70233 Allyson Lake New York, NY 10023
                                  country:
                                    type: string
                                    example: United States
                                  account_id:
                                    type: string
                                    example: '123'
                                    nullable: true
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.vts.com/api/v1/broker/agents?page%5Bafter%5D=MzE2NTE%253D
                        description: The current URL
                      prev:
                        type: string
                        example: https://api.vts.com/api/v1/broker/agents?page%5Bbefore%5D=MzE2NTI%253D
                        description: URL for the previous page of Broker Agents
                      next:
                        type: string
                        example: https://api.vts.com/api/v1/broker/agents?page%5Bbefore%5D=MzE2NTI%253D
                        description: URL for the next page of Broker Agents
                    required:
                    - self
        '401':
          description: Bad API Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
        '403':
          description: API not authorized for use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
      operationId: get_api-v1-broker-agents
  /api/v1/broker/agents/{id}:
    get:
      summary: Retrieves specific broker agent user
      tags:
      - Broker
      security:
      - basic_auth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns requested broker agent user if it exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1'
                      type:
                        type: string
                        example: broker_agents
                      attributes:
                        type: object
                        properties:
                          first_name:
                            type: string
                            example: John
                          last_name:
                            type: string
                            example: Doe
                          email:
                            type: string
                            example: johndoe@example.com
                          created_at:
                            type: string
                            format: date-time
                            description: The created at date-time the current broker user
                          current_sign_in_at:
                            type: string
                            nullable: true
                            format: date-time
                          is_account_user:
                            type: boolean
                          is_company_admin:
                            type: boolean
                          phone:
                            type: string
                            example: '1234567890'
                          phone_extension:
                            type: string
                            example: '1234'
                          days_signed_in_for_last_30_days:
                            type: number
                            minimum: 0
                            maximum: 30
                            example: 14
                            description: Within the last 30 days, the number of days where the User had at least 1 login
                          days_with_activity_for_last_30_days:
                            type: number
                            minimum: 0
                            maximum: 30
                            example: 10
                            description: Within the last 30 days, the number of days where the User performed at least 1 creation, update, or deletion within VTS Lease
                          email_engagement_for_last_30_days:
                            type: object
                            description: VTS email activity for this User
                            properties:
                              emails_delivered:
                                type: number
                                minimum: 0
                                maximum: 30
                                example: 4
                                description: Within the last 30 days, the number of emails delivered to this User
                              emails_opened:
                                type: number
                                minimum: 0
                                maximum: 30
                                example: 3
                                description: Within the last 30 days, number of emails opened by this User
                          assets:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                  example: asset
                                name:
                                  type: string
                                  example: A property name
                                  nullable: true
                                owner_name:
                                  type: string
                                  example: VTS Investments
                                address:
                                  type: string
                                  example: 70233 Allyson Lake New York, NY 10023
                                country:
                                  type: string
                                  example: United States
                                account_id:
                                  type: string
                                  example: '123'
                                  nullable: true
        '401':
          description: Bad API Credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
        '403':
          description: API not authorized for use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
        '404':
          description: Requested broker agent user does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
      operationId: get_api-v1-broker-agents-id
