                              initial_inquiry:
                                type: number
                                example: 1
                                description: Number of deals with deal stage `initial_inquiry`
                              preview:
                                type: number
                                example: 1
                                description: Number of deals with deal stage `preview`
                              tour:
                                type: number
                                example: 1
