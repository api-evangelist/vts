                                      type: string
                                      example: '12345'
                                    type:
                                      type: string
                                      enum:
                                      - proposals
                                      example: proposals
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: string
                                      format: uri
                            comparative_lease_term:
                              type: object
                              properties:
                                data:
                                  type: object
                                  nullable: true
                                  properties:
                                    id:
                                      type: string
                                      example: '12345'
                                    type:
                                      type: string
                                      enum:
                                      - lease_terms
                                      example: lease_terms
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: string
                                      format: uri
                            created_by:
