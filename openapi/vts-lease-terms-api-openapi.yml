                            type: string
                            format: date
                            nullable: true
                          rent_commencement_date:
                            type: string
                            format: date
                            nullable: true
                          rentable_size:
                            $ref: '#/components/schemas/measure_size'
                          lock_in_end_date:
                            type: string
                            format: date
                            nullable: true
                          retail:
