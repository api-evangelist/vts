              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: deal snapshot
                      id:
                        type: string
                        example: '1'
                        description: The ID of the deal snapshot
                      attributes:
                        type: object
                        properties:
                          account_id:
                            type: integer
                            example: 1
                            description: The id the account who's user generated the deal snapshot
                          user_id:
                            type: integer
                            example: 1
                            description: The id of the user who's generated the deal snapshot
                          metadata:
                            type: object
                            example:
                              metadata_key: metadata_value
                            description: Metadata that was attached to the deal snapshot via a PATCH request to the deal_snapshots endpoint.
                      relationships:
                        type: object
                        properties:
                          deal:
                            type: object
                            properties:
                              data:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: string
                                    example: '12345'
                                  type:
                                    type: string
                                    enum:
                                    - deals
                                    example: deals
                          created_by:
                            type: object
                            properties:
                              data:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: string
                                    example: '12345'
                                  type:
                                    type: string
                                    enum:
                                    - users
                                    example: users
                      includes:
                        type: array
                        items:
                          type: object
                          description: Refer to https://readme.vts.com/docs/deal-snapshot-documentation for a description of the resources returned here
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: https://api.vts.com/api/v1/deal_snapshots/1
        '403':
          description: API not authorized for use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors_object'
        '404':
