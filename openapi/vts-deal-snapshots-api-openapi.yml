- basic_auth: []
tags:
- name: Deal Snapshots
paths:
  /api/v1/deal_snapshots/{id}:
    get:
      summary: Retrieves specific deal snapshot
      tags:
      - Deal Snapshots
      description: Refer to https://readme.vts.com/docs/deal-snapshot-documentation for a description of deal snapshots payload
      security:
      - basic_auth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
