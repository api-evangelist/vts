image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/vts.png
name: VTS
description: VTS (View The Space) is the commercial real estate leasing, asset management, and tenant-experience
  platform used by landlords, property managers, and brokers to run their leasing pipeline and operate their
  buildings. The VTS Lease REST API exposes portfolio data — assets, spaces, leases, deals, deal terms, lease
  terms, financials, budgets, tenants, buildings, and listings — plus a Leasing Availability API for publishing
  real-time building/listing availability, and VTS Activate (OIDC/SAML SSO and bulk data export) for the tenant-experience
  product. Authentication is HTTP Basic (API Key + Secret) for the Lease API and OAuth 2.0 Authorization Code
  with PKCE / OpenID Connect for Activate. The developer portal, reference, sandbox, and changelog are public
  at readme.vts.com.
