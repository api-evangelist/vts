generated: '2026-07-21'
method: searched
source: https://readme.vts.com/docs + openapi/vts-openapi.yml
base_url:
  production: https://api.vts.com
  sandbox: https://sandbox.vts.com
  base_path: /api/v1
authentication:
  style: HTTP Basic (API Key as username, API Secret as password) for the Lease API; OAuth 2.0 Authorization
    Code + PKCE / OIDC for VTS Activate
  ref: authentication/vts-authentication.yml
pagination:
  style: cursor
  params:
  - page[after]
