  - page[size]
  note: Base64-encoded opaque cursors; responses expose next/prev cursor links.
filtering:
  style: JSON:API-like
  params_example:
  - filter[approval_setting_id]
  - filter[multi_building_asset_id]
errors:
  envelope_field: errors
  ref: errors/vts-problem-types.yml
  format: custom errors[] array (not RFC 9457)
idempotency:
  supported: false
  note: No documented idempotency-key header; API is predominantly read-only (GET) with a few PATCH/POST
    write endpoints (deal snapshots, delinquencies, retail sales).
versioning:
  ref: lifecycle/vts-lifecycle.yml
  scheme: uri-path
  current: v1
content_type: application/json (Lease API); XML on the /api/connect/v1 auth-check endpoint
rate_limits:
  documented: false
